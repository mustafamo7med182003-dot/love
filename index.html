<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>من مصطفي إلى دانة 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8637a;
    --deep: #b5294e;
    --blush: #fce4ec;
    --gold: #f7c59f;
    --dark: #1a0a0f;
    --soft: #fff0f3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'Amiri', serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== CANVAS STARS ===== */
  #starCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== FLOATING PETALS ===== */
  .petal {
    position: fixed;
    font-size: 1.4rem;
    pointer-events: none;
    z-index: 1;
    animation: petalFall linear infinite;
    opacity: 0;
  }
  @keyframes petalFall {
    0%   { transform: translateY(-60px) rotate(0deg) translateX(0); opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(60px); opacity: 0; }
  }

  /* ===== LOCK SCREEN ===== */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #2d0a1a 0%, #0d0005 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .lock-title {
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    text-align: center;
    margin-bottom: 0.3rem;
    animation: fadeSlideDown 1s ease forwards;
    opacity: 0;
    text-shadow: 0 0 30px rgba(247,197,159,0.5);
  }
  .lock-subtitle {
    font-family: 'Dancing Script', cursive;
    color: var(--rose);
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeSlideDown 1s 0.3s ease forwards;
    opacity: 0;
  }

  .heart-lock {
    font-size: 4rem;
    animation: heartbeat 1.4s ease-in-out infinite, fadeIn 1s 0.5s forwards;
    opacity: 0;
    margin-bottom: 2rem;
    filter: drop-shadow(0 0 20px #e8637a);
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    30%      { transform: scale(1.18); }
    60%      { transform: scale(1.05); }
  }

  .password-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeIn 1s 0.8s forwards;
    opacity: 0;
  }

  .pw-hint {
    color: rgba(255,255,255,0.5);
    font-size: 0.95rem;
    font-style: italic;
    letter-spacing: 1px;
  }

  .pw-input {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(232,99,122,0.4);
    border-radius: 50px;
    padding: 0.85rem 2rem;
    font-size: 1.1rem;
    font-family: 'Amiri', serif;
    color: #fff;
    text-align: center;
    width: 280px;
    outline: none;
    transition: border 0.3s, box-shadow 0.3s, background 0.3s;
    letter-spacing: 2px;
  }
  .pw-input::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 1px; }
  .pw-input:focus {
    border-color: var(--rose);
    box-shadow: 0 0 20px rgba(232,99,122,0.35);
    background: rgba(255,255,255,0.1);
  }

  .pw-btn {
    background: linear-gradient(135deg, var(--rose), var(--deep));
    border: none;
    border-radius: 50px;
    padding: 0.85rem 2.5rem;
    color: #fff;
    font-size: 1.1rem;
    font-family: 'Amiri', serif;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 4px 20px rgba(232,99,122,0.4);
    letter-spacing: 1px;
  }
  .pw-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(232,99,122,0.6); }

  .pw-error {
    color: #ff6b6b;
    font-size: 0.9rem;
    min-height: 1.2rem;
    transition: opacity 0.3s;
  }

  /* ===== UNLOCK EXPLOSION ===== */
  #unlockOverlay {
    position: fixed;
    inset: 0;
    background: transparent;
    z-index: 200;
    pointer-events: none;
    display: none;
  }

  .love-burst {
    position: absolute;
    font-size: 1.8rem;
    animation: burst 1.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(0); opacity: 1; }
    60%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }

  .center-love {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3rem, 10vw, 7rem);
    color: #fff;
    text-shadow: 0 0 60px #e8637a, 0 0 120px #b5294e;
    z-index: 210;
    pointer-events: none;
    white-space: nowrap;
    animation: none;
  }
  .center-love.show {
    animation: lovePop 2.5s ease forwards;
  }
  @keyframes lovePop {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-10deg); opacity: 0; }
    30%  { transform: translate(-50%,-50%) scale(1.3) rotate(3deg); opacity: 1; }
    55%  { transform: translate(-50%,-50%) scale(0.95) rotate(-1deg); }
    75%  { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
    90%  { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }

  /* ===== MAIN PAGE ===== */
  #mainPage {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 10;
  }

  .main-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(181,41,78,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(232,99,122,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, #120008 0%, #0a0004 100%);
    z-index: 0;
  }

  /* Ambient floating hearts */
  .ambient-heart {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) scale(0.5) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1) rotate(20deg); opacity: 0; }
  }

  /* Hero section */
  .hero {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .hero-tag {
    color: rgba(247,197,159,0.7);
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    animation: fadeIn 1s 0.3s forwards;
    opacity: 0;
  }

  .hero-from {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    color: #fff;
    line-height: 1.1;
    margin-bottom: 0.5rem;
    animation: fadeSlideDown 1s 0.5s forwards;
    opacity: 0;
    text-shadow: 0 2px 40px rgba(232,99,122,0.4);
  }

  .hero-arrow {
    font-size: 2rem;
    color: var(--rose);
    margin: 0.5rem 0;
    animation: pulse 1.5s ease infinite, fadeIn 1s 0.9s forwards;
    opacity: 0;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.2)} }

  .hero-to {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3rem, 9vw, 7rem);
    background: linear-gradient(135deg, var(--rose), var(--gold), var(--rose));
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite, fadeSlideDown 1s 1.1s forwards;
    opacity: 0;
    filter: drop-shadow(0 0 20px rgba(232,99,122,0.4));
  }
  @keyframes shimmer { 0%{background-position:0%}100%{background-position:200%} }

  .hero-hearts {
    margin-top: 2rem;
    font-size: 2.5rem;
    animation: fadeIn 1s 1.5s forwards;
    opacity: 0;
    letter-spacing: 8px;
    filter: drop-shadow(0 0 10px #e8637a);
  }

  /* Letter card */
  .letter-section {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem 6rem;
  }

  .envelope-btn {
    position: relative;
    cursor: pointer;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    animation: float 3s ease-in-out infinite, fadeIn 1.2s 2s forwards;
    opacity: 0;
  }
  @keyframes float {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }

  .envelope-icon {
    font-size: 7rem;
    filter: drop-shadow(0 0 30px rgba(232,99,122,0.7));
    transition: transform 0.3s;
  }
  .envelope-btn:hover .envelope-icon { transform: scale(1.1) rotate(-3deg); }

  .envelope-label {
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: 1.4rem;
    text-shadow: 0 0 20px rgba(247,197,159,0.5);
    animation: pulse 2s ease-in-out infinite;
  }

  /* Modal / Letter */
  #letterModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    backdrop-filter: blur(8px);
  }
  #letterModal.open {
    display: flex;
    animation: fadeIn 0.4s ease;
  }

  .letter-card {
    background: linear-gradient(160deg, #2a0a14 0%, #1a0610 100%);
    border: 1px solid rgba(232,99,122,0.3);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    max-width: 520px;
    width: 100%;
    position: relative;
    box-shadow:
      0 0 60px rgba(232,99,122,0.25),
      0 30px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    animation: letterOpen 0.6s cubic-bezier(.17,.67,.35,1.3) forwards;
  }
  @keyframes letterOpen {
    0%   { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .letter-close {
    position: absolute;
    top: 1rem; left: 1rem;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    color: rgba(255,255,255,0.6);
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .letter-close:hover { background: rgba(232,99,122,0.3); color: #fff; }

  .letter-ornament {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 1.5rem;
    opacity: 0.8;
    letter-spacing: 6px;
  }

  .letter-greeting {
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 20px rgba(247,197,159,0.4);
  }

  .letter-body {
    color: rgba(255,255,255,0.88);
    font-size: 1.25rem;
    line-height: 2.1;
    text-align: center;
    position: relative;
  }
  .letter-body::before,
  .letter-body::after {
    content: '"';
    font-family: 'Dancing Script', cursive;
    color: var(--rose);
    font-size: 4rem;
    line-height: 0;
    vertical-align: -1.5rem;
    opacity: 0.5;
  }

  .letter-sig {
    margin-top: 2rem;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    color: var(--rose);
    font-size: 1.5rem;
    text-shadow: 0 0 15px rgba(232,99,122,0.5);
  }

  .letter-footer-hearts {
    text-align: center;
    font-size: 1.5rem;
    margin-top: 1.2rem;
    letter-spacing: 4px;
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px #e8637a);
  }

  /* ===== GLOBAL KEYFRAMES ===== */
  @keyframes fadeSlideDown {
    0%   { opacity: 0; transform: translateY(-30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 4px; }
</style>
</head>
<body>

<!-- Stars -->
<canvas id="starCanvas"></canvas>

<!-- Petals -->
<div id="petalsContainer"></div>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <p class="lock-title">✦ من مصطفي ✦</p>
  <p class="lock-subtitle">إلى دانة 🌹</p>
  <div class="heart-lock">💝</div>
  <div class="password-wrap">
    <p class="pw-hint">سلم و استلم</p>
    <input class="pw-input" id="pwInput" type="password" placeholder="اكتبي الباسورد هنا..." autocomplete="off"/>
    <button class="pw-btn" onclick="checkPassword()">✦ افتحي قلبي ✦</button>
    <p class="pw-error" id="pwError"></p>
  </div>
</div>

<!-- UNLOCK EXPLOSION OVERLAY -->
<div id="unlockOverlay"></div>
<div class="center-love" id="centerLove">بحبك 💕</div>

<!-- MAIN PAGE -->
<div id="mainPage">
  <div class="main-bg"></div>
  <div id="ambiHearts"></div>

  <section class="hero">
    <p class="hero-tag">✦ رسالة حب ✦</p>
    <div class="hero-from">من مصطفي</div>
    <div class="hero-arrow">↓ 💕 ↓</div>
    <div class="hero-to">دانة</div>
    <div class="hero-hearts">🌹 💕 🌸 💕 🌹</div>
  </section>

  <section class="letter-section">
    <button class="envelope-btn" onclick="openLetter()">
      <span class="envelope-icon">💌</span>
      <span class="envelope-label">اضغطي هنا... في رسالة ليكِ 🌹</span>
    </button>
  </section>
</div>

<!-- LETTER MODAL -->
<div id="letterModal">
  <div class="letter-card">
    <button class="letter-close" onclick="closeLetter()">✕</button>
    <div class="letter-ornament">🌹 ✦ 🌹</div>
    <div class="letter-greeting">يا دانة الحلوة 💕</div>
    <p class="letter-body">
      بحبك يا دانة... وحشيتيني
    </p>
    <div class="letter-sig">— مصطفي 🌹</div>
    <div class="letter-footer-hearts">💕 💖 💕</div>
  </div>
</div>

<script>
// ====== STARS ======
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initStars() {
  stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      o: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2
    });
  }
}
initStars();

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.phase += s.speed;
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 220, 230, ${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// ====== PETALS ======
const emojis = ['🌸','🌹','🌺','💮','✿','❀'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
  const dur = 6 + Math.random() * 8;
  p.style.animationDuration = dur + 's';
  p.style.animationDelay = Math.random() * 4 + 's';
  document.getElementById('petalsContainer').appendChild(p);
  setTimeout(() => p.remove(), (dur + 4) * 1000);
}
setInterval(spawnPetal, 700);

// ====== PASSWORD ======
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
  document.getElementById('pwError').textContent = '';
});

function checkPassword() {
  const val = document.getElementById('pwInput').value.trim();
  if (val === 'افتح يا سمسم') {
    unlockAnimation();
  } else {
    const err = document.getElementById('pwError');
    err.textContent = '💔 الباسورد غلط، حاولي تاني!';
    document.getElementById('pwInput').style.borderColor = '#ff6b6b';
    setTimeout(() => {
      err.textContent = '';
      document.getElementById('pwInput').style.borderColor = 'rgba(232,99,122,0.4)';
    }, 2000);
  }
}

// ====== UNLOCK ANIMATION ======
function unlockAnimation() {
  const overlay = document.getElementById('unlockOverlay');
  overlay.style.display = 'block';

  // Burst hearts
  const loveWords = ['💕','💖','💗','❤️','🌹','💝','💘','✨','🌸','💓'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'love-burst';
      el.textContent = loveWords[Math.floor(Math.random() * loveWords.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 280;
      el.style.cssText = `
        left: 50%; top: 50%;
        --dx: ${Math.cos(angle) * dist}px;
        --dy: ${Math.sin(angle) * dist}px;
        font-size: ${1.2 + Math.random() * 2}rem;
        animation-duration: ${0.8 + Math.random() * 0.8}s;
      `;
      overlay.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }, Math.random() * 600);
  }

  // Center بحبك
  const cl = document.getElementById('centerLove');
  cl.style.display = 'block';
  cl.classList.add('show');

  // Multiple waves of بحبك
  for (let w = 0; w < 3; w++) {
    setTimeout(() => {
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const t = document.createElement('div');
          t.style.cssText = `
            position:fixed;
            left:${5 + Math.random()*88}%;
            top:${5 + Math.random()*88}%;
            font-family:'Dancing Script',cursive;
            font-size:${1.2 + Math.random()*2.5}rem;
            color:rgba(${Math.random()>0.5?'232,99,122':'247,197,159'},0.92);
            pointer-events:none;
            z-index:205;
            animation:fadeIn 0.5s forwards, heartbeat 1s ease-in-out infinite;
            text-shadow:0 0 15px currentColor;
            white-space:nowrap;
          `;
          t.textContent = ['بحبك 💕','❤️ بحبك','دانة 🌹','💖 بحبك يا دانة'][Math.floor(Math.random()*4)];
          document.body.appendChild(t);
          setTimeout(() => t.remove(), 2500);
        }, i * 80);
      }
    }, w * 500);
  }

  // Transition to main page
  setTimeout(() => {
    const lock = document.getElementById('lockScreen');
    lock.style.opacity = '0';
    lock.style.transform = 'scale(1.05)';
    setTimeout(() => {
      lock.style.display = 'none';
      overlay.style.display = 'none';
      cl.style.display = 'none';
      showMainPage();
    }, 800);
  }, 2800);
}

// ====== MAIN PAGE ======
function showMainPage() {
  const main = document.getElementById('mainPage');
  main.style.display = 'block';
  main.style.animation = 'fadeIn 1s forwards';
  spawnAmbientHearts();
}

function spawnAmbientHearts() {
  const container = document.getElementById('ambiHearts');
  const h = ['💕','💖','🌸','💗','🌹','✨','💝'];
  function makeHeart() {
    const el = document.createElement('div');
    el.className = 'ambient-heart';
    el.textContent = h[Math.floor(Math.random()*h.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.fontSize = (0.8+Math.random()*1.5)+'rem';
    const dur = 8+Math.random()*10;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = Math.random()*4+'s';
    container.appendChild(el);
    setTimeout(()=>el.remove(),(dur+4)*1000);
  }
  for(let i=0;i<6;i++) setTimeout(makeHeart, i*600);
  setInterval(makeHeart, 1500);
}

// ====== LETTER ======
function openLetter() {
  const m = document.getElementById('letterModal');
  m.classList.add('open');
  // mini heart burst on open
  for(let i=0;i<20;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.style.cssText=`position:fixed;left:50%;top:50%;font-size:${1+Math.random()*1.5}rem;pointer-events:none;z-index:310;animation:burst 1s ease-out forwards;`;
      const a=Math.random()*Math.PI*2, d=60+Math.random()*120;
      el.style.setProperty('--dx',Math.cos(a)*d+'px');
      el.style.setProperty('--dy',Math.sin(a)*d+'px');
      el.textContent=['💕','🌹','💖','💗','✨'][Math.floor(Math.random()*5)];
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1000);
    },i*50);
  }
}

function closeLetter() {
  document.getElementById('letterModal').classList.remove('open');
}

document.getElementById('letterModal').addEventListener('click', function(e){
  if(e.target === this) closeLetter();
});
</script>
